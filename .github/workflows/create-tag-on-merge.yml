name: Create release tag on merge

on:
  pull_request:
    types: [ closed ]
    branches:
      - main
permissions:
  contents: write
  actions: write # dispatch publish.yml

jobs:
  create-and-push-tag:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    name: Create & push tag
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6

      - uses: ./.github/actions/get-version
        id: version
        with:
          file-name: Directory.Build.props
      
      - name: Create tag
        uses: tvdias/github-tagger@v0.0.2
        with: 
          commit-sha: ${{ github.event.pull_request.merge_commit_sha }}
          repo-token: ${{ github.token }}
          tag: ${{ steps.version.outputs.tag }}

      # Tags created with GITHUB_TOKEN don't trigger publish.yml's push event, so dispatch it
      # explicitly on the new tag (workflow_dispatch is exempt from that restriction).
      - name: Start publish workflow
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh workflow run publish.yml --repo "${GITHUB_REPOSITORY}" --ref "${TAG}"