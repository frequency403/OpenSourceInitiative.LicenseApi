name: Publish NuGet

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  pack-and-publish:
    name: Pack & Publish (tag)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
          
      - name: Get version
        uses: ./.github/actions/get-version
        id: gate
        with:
          file-name: Directory.Build.props
          
      - name: Verify tag matches project version
        shell: bash
        run: |
          if [[ "${{ github.ref_name }}" != "${{ steps.gate.outputs.tag }}" ]]; then
            echo "::error::Git tag ${{ github.ref_name }} does not match project version ${{ steps.gate.outputs.tag }}"
            exit 1
          fi

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Pack Core package
        run: >-
          dotnet pack OpenSourceInitiative.LicenseApi/OpenSourceInitiative.LicenseApi.csproj
          -c Release -o ./nupkg
          --no-build
          -p:PackageVersion=${{ steps.gate.outputs.version }}
          -p:ContinuousIntegrationBuild=true
          
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet.org
        run: >-
          dotnet nuget push "./nupkg/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Create GitHub Release and upload packages
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.gate.outputs.tag }}
          name: ${{ steps.gate.outputs.tag }}
          prerelease: false
          generate_release_notes: true
          files: |
            nupkg/*.nupkg