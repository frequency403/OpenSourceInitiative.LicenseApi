version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    assignees:
      - frequency403
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "nuget"
    directory: "/"
    target-branch: "develop"
    assignees:
      - frequency403
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      nuget:
        patterns:
          - "*"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"